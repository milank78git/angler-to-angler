plugins { id 'com.android.application' version '8.13.2' }
def appLinkHost = providers.exec { commandLine 'python3', rootProject.file('scripts/app-link-host.py') }.standardOutput.asText.get().trim()
def projectPages = System.getenv('ANGLER_ACCOUNT_PAGES') ?: 'false'
if (!(projectPages in ['true', 'false']) || (projectPages == 'true' && System.getenv('ANGLER_APP_LINK_HOST')?.trim())) {
    throw new GradleException('Choose one account callback mode and set ANGLER_ACCOUNT_PAGES to true or false')
}
android {
    namespace 'app.anglers.journal'
    compileSdk 36
    flavorDimensions += 'channel'
    productFlavors {
        pilot { dimension 'channel' }
        play { dimension 'channel'; targetSdk 36 }
    }
    defaultConfig {
        applicationId 'app.anglers.journal'
        minSdk 26
        targetSdk 35
        manifestPlaceholders = [appLinkHost: appLinkHost]
        resValue 'string', 'app_link_host', appLinkHost
        resValue 'bool', 'use_project_pages', projectPages
        resValue 'bool', 'use_verified_links', (System.getenv('ANGLER_APP_LINK_HOST')?.trim() ? 'true' : 'false')
        versionCode Integer.parseInt(System.getenv('ANGLER_VERSION_CODE') ?: '37')
        versionName '0.24.0'
    }
}

def accountAssets = layout.buildDirectory.dir('generated/accountAssets')
def generateAccountConfig = tasks.register('generateAccountConfig', Exec) {
    def output = accountAssets.get().file('account-config.json').asFile
    outputs.dir(accountAssets)
    outputs.upToDateWhen { false }
    commandLine 'python3', rootProject.file('scripts/account-config.py'), output
}
android.sourceSets.main.assets.srcDir(accountAssets)
tasks.named('preBuild').configure { dependsOn(generateAccountConfig) }

dependencies { playImplementation 'com.android.billingclient:billing:8.3.0' }
