<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://tile.openmaps.fr https://ags.cuzk.gov.cz https://tiles.maps.eox.at; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Angler to Angler</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="public-card-view.css" />
    <script type="module" src="boot.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topinner">
        <span class="brand-mark" id="mark" aria-hidden="true"></span>
        <div class="brand-text">
          <strong id="brand">Angler to Angler</strong>
          <small id="app-version" hidden></small>
        </div>
        <span class="offline" id="offline"></span>
        <button type="button" id="profile"></button>
        <button type="button" id="guide-open" class="icon-btn">?</button>
        <button type="button" id="theme" class="icon-btn"></button>
      </div>
    </header>
    <main id="screen" tabindex="-1"></main>
    <nav id="tabs" hidden></nav>
    <dialog id="guide-dialog" aria-labelledby="guide-title">
      <div class="guide-tools"><button id="guide-index" type="button"></button><button id="guide-close" type="button"></button></div>
      <h2 id="guide-title" tabindex="-1"></h2><div id="guide-body"></div>
    </dialog>
    <dialog id="confirmation" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
      <div class="confirmation-heading">
        <span id="confirmation-icon" aria-hidden="true"></span>
        <h2 id="confirmation-title"></h2>
      </div>
      <div id="confirmation-catch" hidden>
        <img id="confirmation-photo" alt="" hidden />
        <div><strong id="confirmation-species"></strong><span id="confirmation-water"></span></div>
      </div>
      <p id="confirmation-message"></p>
      <div class="actions">
        <button type="button" id="confirmation-cancel" class="secondary" autofocus></button>
        <button type="button" id="confirmation-accept"></button>
      </div>
    </dialog>
    <p id="notice" role="status" hidden></p>
  </body>
</html>
