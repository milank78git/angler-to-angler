<!doctype html>
<html lang="[[locale]]"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>[[title]]</title></head>
<body style="margin:0;background:#f5f6ef;color:#142f2b;font:16px/1.5 Arial,sans-serif">
<main style="max-width:520px;margin:24px auto;background:#fffef8;padding:28px">
<p style="color:#165449;font-weight:bold">[[brand]]</p>
<h1 style="font-size:24px">[[title]]</h1>
<p>[[instruction]]</p>
<p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#165449;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">[[action]]</a></p>
<p>[[expiry]]</p><p style="font-size:14px">[[fallback]]<br><a href="{{ .ConfirmationURL }}" style="color:#165449;word-break:break-all">{{ .ConfirmationURL }}</a></p>
</main></body></html>
