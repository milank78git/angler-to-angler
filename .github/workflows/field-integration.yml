name: Field integration
on: [workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  register-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Supabase and the loopback TLS proxy listen in Linux's ephemeral port range.
      # Reserve their ports before the runner opens outbound image and SDK download connections.
      - name: Reserve local service ports
        run: |
          reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}54321-54329,58443"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out the last local-only journal for the Android upgrade test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2744dfae229eeb9814e274ecc28cdc33701eb0cf # v0.23.0-build.10135
          path: legacy-journal
          persist-credentials: false
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: 2.75.0
      - run: bash tests/field-integration/start.sh
      - uses: gradle/actions/wrapper-validation@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          cache: gradle
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;35.0.0 platform-tools"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash tests/field-integration/android.sh
      - name: Restore voluntary ratings and the registered identity on a new local stack
        run: bash tests/field-integration/restore.sh
