name: Prepare pilot signing lineage
on: workflow_dispatch
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0'
      - name: Authorize the configured release certificate
        env:
          ANDROID_PILOT_KEYSTORE: ${{ secrets.ANDROID_PILOT_KEYSTORE }}
          ANDROID_ROTATED_KEYSTORE: ${{ secrets.ANDROID_ROTATED_KEYSTORE }}
          ANDROID_ROTATED_PASSWORD: ${{ secrets.ANDROID_ROTATED_PASSWORD }}
          ANDROID_ROTATED_ALIAS: ${{ vars.ANDROID_ROTATED_ALIAS }}
          ANDROID_ROTATED_CERTIFICATE: ${{ vars.ANDROID_ROTATED_CERTIFICATE }}
        run: bash scripts/prepare-pilot-lineage.sh "$(cat scripts/pilot-original.sha256)" "$RUNNER_TEMP/pilot.lineage"
      - name: Upload the public proof of rotation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pilot-lineage
          path: ${{ runner.temp }}/pilot.lineage
          if-no-files-found: error
          retention-days: 7
          overwrite: true
