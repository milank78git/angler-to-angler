name: Google Play bundle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platforms;android-36 build-tools;35.0.0"
      - name: Build the Play release variant
        env:
          ANGLER_ACCOUNT_PAGES: 'true'
          ANGLER_ACCOUNT_CONFIG: ${{ vars.ANGLER_PLAY_ACCOUNT_CONFIG }}
        run: |
          curl --fail --location --retry 3 --silent --show-error https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/play-gradle"
          export ANGLER_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          "$RUNNER_TEMP/play-gradle/gradle-8.13/bin/gradle" :app:bundlePlayRelease
          python3 -m unittest discover -s tests -p 'play_settlement_test.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: play-release-bundle
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
