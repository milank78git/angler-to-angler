name: Czech water directory refresh
on:
  schedule:
    - cron: '15 5 2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install coordinate conversion tools
        run: sudo apt-get update && sudo apt-get install -y python3-gdal
      - name: Prepare the offline atlas and additive database migration
        run: |
          /usr/bin/python3 scripts/import-czech-waters.py "$RUNNER_TEMP/water-cache" \
            --download --as-of "$(date -u +%F)" --sql "$RUNNER_TEMP/czech-waters.sql"
          git diff --stat >> "$GITHUB_STEP_SUMMARY"
          git diff --binary -- app/src/main/assets/czech-water*.json > "$RUNNER_TEMP/czech-waters.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: czech-water-directory-candidate
          path: |
            ${{ runner.temp }}/czech-waters.patch
            ${{ runner.temp }}/czech-waters.sql
          retention-days: 30
