name: Android pilot
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Promote this published pilot tag to a stable release (e.g. v0.4.4-build.10042)'
        required: true
        type: string
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  profiles:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify profiles, invites and private group membership
        run: |
          sudo systemctl start postgresql
          fixture=$(mktemp -d)
          chmod 755 "$fixture"
          install -d "$fixture/tests" "$fixture/supabase/migrations"
          install -m644 tests/*-db.sql "$fixture/tests/"
          install -m644 supabase/migrations/*.sql "$fixture/supabase/migrations/"
          sed '/^create extension /d' supabase/migrations/20261124060300_water_directory_schedule.sql > "$fixture/supabase/migrations/atlas-schedule-fixture.sql"
          # Commit the fixture only inside this disposable database for multi-session purchase tests.
          sudo -u postgres createdb angler_fixture
          sed 's/^rollback;$/commit;/' "$fixture/tests/profile-db.sql" > "$fixture/tests/committed.sql"
          install -m644 tests/market-race.py "$fixture/tests/"
          sudo -u postgres env PGTZ=UTC psql -X -v ON_ERROR_STOP=1 -d angler_fixture -f "$fixture/tests/committed.sql"
          sudo -u postgres env PGDATABASE=angler_fixture python3 "$fixture/tests/market-race.py"
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: python3 scripts/index-translations.py --check
      - run: python3 tests/account-links.py
      - run: python3 scripts/build-account-links.py build/account-links
      - name: Check live Android association before issuing HTTPS links
        if: github.event_name == 'push' && vars.ANGLER_APP_LINK_HOST != ''
        env:
          LINK_HOST: ${{ vars.ANGLER_APP_LINK_HOST }}
        run: python3 scripts/check-account-links.py "$LINK_HOST" build/account-links
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: horistum-account-links
          path: build/account-links/
          include-hidden-files: true
      - run: go test tests/email_templates_test.go
      - run: python3 scripts/build-email-templates.py build/auth-email
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auth-email-templates
          path: build/auth-email/
      - run: node --test tests/*.test.cjs
      - run: python3 tests/water-release.py
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - name: Assign the installable Android build number
        run: echo "ANGLER_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: bash scripts/build-debug.sh
        env:
          ANGLER_APP_LINK_HOST: ${{ vars.ANGLER_APP_LINK_HOST }}
          ANGLER_ACCOUNT_CONFIG: ${{ vars.ANGLER_ACCOUNT_CONFIG }}
      - run: bash scripts/build-debug.sh --preview
        env:
          ANGLER_ACCOUNT_CONFIG: ${{ vars.ANGLER_ACCOUNT_CONFIG }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: angler-journal-debug
          path: build/standalone/angler-journal-debug.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: angler-ui-preview
          path: build/preview/angler-journal-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise journal and offline catalog on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash scripts/android-smoke.sh
      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: android-ui-screens
          path: build/smoke/screens
          if-no-files-found: warn

  field-integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/field-integration.yml

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, profiles, field-integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: angler-journal-debug
          path: build/input
      - name: Sign the tested application for existing pilot installations
        id: package
        env:
          ANDROID_PILOT_KEYSTORE: ${{ secrets.ANDROID_PILOT_KEYSTORE }}
        run: bash scripts/sign-pilot.sh build/input/angler-journal-debug.apk
      - name: Publish the APK and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: bash scripts/pilot-release.sh publish "$TAG"

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark the selected published APK as stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/pilot-release.sh promote "$TAG"
