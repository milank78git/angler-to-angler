name: Android pilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.cjs
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - run: bash scripts/build-debug.sh
      - run: bash scripts/build-debug.sh --preview
      - uses: actions/upload-artifact@v4
        with:
          name: angler-journal-debug
          path: build/standalone/angler-journal-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: angler-ui-preview
          path: build/preview/angler-journal-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise journal and offline catalog on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash scripts/android-smoke.sh
      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-screens
          path: build/smoke/screens
          if-no-files-found: warn
