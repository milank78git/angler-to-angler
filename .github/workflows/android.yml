name: Android pilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify profile isolation, document receipts and erasure
        run: |
          sudo systemctl start postgresql
          sudo install -m 644 tests/profile-db.sql /tmp/angler-profile-db.sql
          sudo install -m 644 supabase/migrations/202611230001_profiles.sql /tmp/angler-profile-schema.sql
          sed -i 's@../supabase/migrations/202611230001_profiles.sql@/tmp/angler-profile-schema.sql@' /tmp/angler-profile-db.sql
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -f /tmp/angler-profile-db.sql
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.cjs
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - run: bash scripts/build-debug.sh
        env:
          ANGLER_ACCOUNT_CONFIG: ${{ vars.ANGLER_ACCOUNT_CONFIG }}
      - run: bash scripts/build-debug.sh --preview
        env:
          ANGLER_ACCOUNT_CONFIG: ${{ vars.ANGLER_ACCOUNT_CONFIG }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: angler-journal-debug
          path: build/standalone/angler-journal-debug.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: angler-ui-preview
          path: build/preview/angler-journal-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise journal and offline catalog on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash scripts/android-smoke.sh
      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ui-screens
          path: build/smoke/screens
          if-no-files-found: warn
