name: Android pilot
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Leave empty to build and publish a new pilot. Enter a published pilot tag to promote it to stable.'
        required: false
        type: string
  push:
    branches: [main]
permissions:
  contents: read
env:
  ANDROID_ROTATED_CERTIFICATE: ${{ vars.ANDROID_ROTATED_CERTIFICATE }}
  ANGLER_ATLAS_PUBLIC_KEY: ${{ vars.ANGLER_ATLAS_PUBLIC_KEY }}
jobs:
  profiles:
    if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.tag == '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify profiles, invites and private group membership
        run: |
          sudo systemctl start postgresql
          fixture=$(mktemp -d)
          chmod 755 "$fixture"
          install -d "$fixture/tests" "$fixture/supabase/migrations"
          install -m644 tests/*-db.sql "$fixture/tests/"
          install -m644 supabase/migrations/*.sql "$fixture/supabase/migrations/"
          sed '/^create extension /d' supabase/migrations/20261124060300_water_directory_schedule.sql > "$fixture/supabase/migrations/atlas-schedule-fixture.sql"
          # Commit the fixture only inside this disposable database for multi-session database tests.
          sudo -u postgres createdb angler_fixture
          sed 's/^rollback;$/commit;/' "$fixture/tests/profile-db.sql" > "$fixture/tests/committed.sql"
          install -m644 tests/{market,journal-maintenance,photo-retention}-race.py "$fixture/tests/"
          sudo -u postgres env PGTZ=UTC psql -X -v ON_ERROR_STOP=1 -d angler_fixture -f "$fixture/tests/committed.sql"
          python3 scripts/index-db-functions.py --signatures | LC_ALL=C sort > "$fixture/expected"
          sudo -u postgres psql -XAt -v ON_ERROR_STOP=1 -d angler_fixture \
            -c "select n.nspname||'.'||p.proname||'('||pg_catalog.oidvectortypes(p.proargtypes)||')'
                from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                where n.nspname like 'angler%' or (n.nspname='public' and p.proname like 'angler%')" \
            | LC_ALL=C sort > "$fixture/installed"
          diff -u "$fixture/expected" "$fixture/installed"
          sudo -u postgres env PGDATABASE=angler_fixture python3 "$fixture/tests/market-race.py"
          sudo -u postgres env PGDATABASE=angler_fixture python3 "$fixture/tests/journal-maintenance-race.py"
          sudo -u postgres env PGDATABASE=angler_fixture python3 "$fixture/tests/photo-retention-race.py"
  android-package:
    if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.tag == '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: gradle/actions/wrapper-validation@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          cache: gradle
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: python3 scripts/index-db-functions.py --check
      - name: Validate dictionaries and compare translations with the pull request base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            python3 scripts/index-translations.py --check --against "$BASE_SHA"
          else
            python3 scripts/index-translations.py --check
          fi
      - run: python3 tests/account-documents.py
      - run: python3 tests/account-links.py
      - if: vars.ANDROID_ROTATED_CERTIFICATE != '' || vars.ANGLER_APP_LINK_HOST != ''
        run: python3 scripts/build-account-links.py build/account-links
      - name: Check live Android association before issuing HTTPS links
        if: github.event_name != 'pull_request' && vars.ANGLER_APP_LINK_HOST != ''
        env:
          LINK_HOST: ${{ vars.ANGLER_APP_LINK_HOST }}
        run: python3 scripts/check-account-links.py "$LINK_HOST" build/account-links
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: vars.ANDROID_ROTATED_CERTIFICATE != ''
        with:
          name: direct-android-app-links
          path: build/account-links/
          include-hidden-files: true
      - run: go test tests/email_templates_test.go
      - run: python3 scripts/build-email-templates.py build/auth-email
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auth-email-templates
          path: build/auth-email/
      - run: node --test tests/*.test.cjs
      - run: python3 tests/water-release.py
      - run: python3 tests/atlas-signature.py
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platforms;android-35 platforms;android-36 build-tools;35.0.0 platform-tools"
      - name: Assign the installable Android build number
        run: echo "ANGLER_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: bash scripts/build-debug.sh
        env:
          ANGLER_ACCOUNT_PAGES: ${{ vars.ANGLER_ACCOUNT_PAGES }}
          ANGLER_APP_LINK_HOST: ${{ vars.ANGLER_APP_LINK_HOST }}
          ANGLER_ACCOUNT_CONFIG: ${{ vars.ANGLER_ACCOUNT_CONFIG }}
      - run: bash scripts/build-debug.sh --preview
        env:
          ANGLER_ACCOUNT_CONFIG: ${{ vars.ANGLER_ACCOUNT_CONFIG }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: angler-journal-debug
          path: build/standalone/angler-journal-debug.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: preview
        with:
          if-no-files-found: error
          overwrite: true
          name: angler-ui-preview
          path: build/preview/angler-journal-debug.apk

      - name: Link the installable test APK
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          echo "### Android preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the preview APK (ZIP)]($PREVIEW_URL). Sign in to GitHub and extract the APK. It installs alongside the pilot." >> "$GITHUB_STEP_SUMMARY"
          echo "[Signed pilot updates]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases) are published by the release job on main." >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise journal and offline catalog on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            bash tests/pilot-lineage.sh build/standalone/angler-journal-debug.apk --install-on-emulator
            bash scripts/android-smoke.sh
      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: android-ui-screens
          path: build/smoke/screens
          if-no-files-found: warn

  field-integration:
    if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.tag == '')
    uses: ./.github/workflows/field-integration.yml

  # Keep the existing required check effective even before the portable ruleset is reapplied.
  build:
    needs: [android-package, field-integration]
    if: always() && (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.tag == ''))
    runs-on: ubuntu-24.04
    steps:
      - name: Require the Android package and registration/restore rehearsal
        env:
          PACKAGE_RESULT: ${{ needs.android-package.result }}
          INTEGRATION_RESULT: ${{ needs.field-integration.result }}
        run: test "$PACKAGE_RESULT" = success && test "$INTEGRATION_RESULT" = success

  account-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == ''))
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/account-pages.yml

  migrate-pilot:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == ''))
    needs: [build, profiles, account-pages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pilot-database
    concurrency:
      group: hosted-pilot-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Migrate and verify the hosted pilot
        env:
          PILOT_DB_HOST: ${{ vars.PILOT_DB_HOST }}
          PILOT_DB_PASSWORD: ${{ secrets.PILOT_DB_PASSWORD }}
          PILOT_DB_CA: ${{ vars.PILOT_DB_CA }}
        run: bash scripts/deploy-pilot-database.sh

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == ''))
    needs: migrate-pilot
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release signing configuration
        env:
          ANDROID_ROTATED_ALIAS: ${{ vars.ANDROID_ROTATED_ALIAS }}
          HAS_ROTATED_KEY: ${{ secrets.ANDROID_ROTATED_KEYSTORE != '' }}
          HAS_ROTATED_PASSWORD: ${{ secrets.ANDROID_ROTATED_PASSWORD != '' }}
          HAS_LINEAGE: ${{ secrets.ANDROID_PILOT_LINEAGE != '' }}
        run: bash scripts/check-pilot-signing.sh
      - name: Verify deployed handoff before publishing a Pages-enabled APK
        if: vars.ANGLER_ACCOUNT_PAGES == 'true'
        run: python3 scripts/check-account-pages.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: angler-journal-debug
          path: build/input
      - name: Check the published atlas against the signer pinned in this release
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://raw.githubusercontent.com/milank78git/angler-to-angler/water-atlas-v1/manifest.json \
            -o "$RUNNER_TEMP/atlas-manifest.json"
          python3 scripts/atlas-signature.py "$RUNNER_TEMP/atlas-manifest.json"
      - name: Sign the tested application for existing pilot installations
        id: package
        env:
          ANDROID_ROTATED_KEYSTORE: ${{ secrets.ANDROID_ROTATED_KEYSTORE }}
          ANDROID_ROTATED_PASSWORD: ${{ secrets.ANDROID_ROTATED_PASSWORD }}
          ANDROID_ROTATED_ALIAS: ${{ vars.ANDROID_ROTATED_ALIAS }}
          ANDROID_PILOT_LINEAGE: ${{ secrets.ANDROID_PILOT_LINEAGE }}
        run: bash scripts/sign-pilot.sh build/input/angler-journal-debug.apk
      - name: Publish the APK and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          bash scripts/pilot-release.sh publish "$TAG"
          echo "[Download the signed APK]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark the selected published APK as stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/pilot-release.sh promote "$TAG"
