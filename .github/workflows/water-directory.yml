name: Publish the water directory
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/water-directory.yml'
      - 'scripts/*water*.py'
      - 'app/src/main/assets/*waters.json'
      - 'app/src/main/assets/water-sources.json'
permissions:
  contents: write
concurrency:
  group: water-directory-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y python3-gdal poppler-utils
      - name: Refresh providers and publish one consistent version
        run: |
          channel=water-atlas-v1
          published="$RUNNER_TEMP/water-publication"
          cache="$RUNNER_TEMP/water-cache"
          if git ls-remote --exit-code --heads origin "$channel" > /dev/null; then
            git fetch origin "refs/heads/$channel:refs/remotes/origin/$channel"
            git worktree add -b "$channel" "$published" "origin/$channel"
          else
            status=$?
            test "$status" -eq 2
            git worktree add --detach "$published" HEAD
            git -C "$published" switch --orphan "$channel"
          fi
          /usr/bin/python3 scripts/water-release.py "$published" "$cache" --refresh --as-of "$(date -u +%F)"
          cd "$published"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add atlas.json.gz registry.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official fishery data"
            jq --arg commit "$(git rev-parse HEAD)" '. + {commit:$commit}' "$cache/manifest.json" > manifest.json
            git add manifest.json
            git commit -m "Publish the verified atlas manifest"
            git push origin "HEAD:refs/heads/$channel"
          fi
          if test -s "$cache/failed-sources.txt"; then cat "$cache/failed-sources.txt"; exit 1; fi
